<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio3D - Interactive Tile & Room Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .glass-panel { background: rgba(18, 20, 29, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body class="bg-slate-950 text-white select-none">

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Top Navigation Bar -->
  <header class="absolute top-0 left-0 w-full z-10 p-4 flex justify-between items-center pointer-events-none">
    <div class="glass-panel px-5 py-2.5 rounded-2xl pointer-events-auto flex items-center gap-3 shadow-2xl">
      <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
      <span class="font-bold tracking-wide text-sm bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">CERAMIC 3D STUDIO</span>
      <span class="text-xs text-slate-400 border-l border-slate-700 pl-3">WebGL Interactive Visualizer</span>
    </div>

    <div class="glass-panel px-4 py-2 rounded-2xl pointer-events-auto hidden sm:flex items-center gap-2 text-xs text-slate-300 shadow-xl">
      <span>Drag to Rotate</span>
      <span class="text-slate-600">•</span>
      <span>Scroll to Zoom</span>
      <span class="text-slate-600">•</span>
      <span>Right Click to Pan</span>
    </div>
  </header>

  <!-- Left / Bottom Controls Panel -->
  <aside class="absolute bottom-6 left-6 z-10 glass-panel p-5 rounded-3xl w-96 max-w-[calc(100vw-3rem)] shadow-2xl space-y-4">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div>
        <h2 class="text-base font-semibold text-white">Select Floor Finish</h2>
        <p class="text-xs text-slate-400">Click a sample to preview live in 3D</p>
      </div>
      <span class="text-xs font-mono bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">600x1200mm</span>
    </div>

    <!-- Tile Swatches Grid -->
    <div class="grid grid-cols-2 gap-2.5">
      <button onclick="setTile('marble', 145, 'Calacatta Gold Marble')" class="tile-btn group relative p-3 rounded-xl border border-emerald-500/80 bg-slate-900/60 hover:bg-slate-800 transition text-left flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-50 to-stone-200 border border-white/20 shadow-inner flex-shrink-0"></div>
        <div class="overflow-hidden">
          <div class="text-xs font-semibold text-white truncate">Calacatta Gold</div>
          <div class="text-[11px] text-emerald-400 font-mono">₹145 / sq.ft</div>
        </div>
      </button>

      <button onclick="setTile('nero', 165, 'Nero Marquina Black')" class="tile-btn group relative p-3 rounded-xl border border-slate-800 hover:border-slate-600 bg-slate-900/60 hover:bg-slate-800 transition text-left flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-stone-900 to-black border border-white/10 shadow-inner flex-shrink-0"></div>
        <div class="overflow-hidden">
          <div class="text-xs font-semibold text-white truncate">Nero Marquina</div>
          <div class="text-[11px] text-emerald-400 font-mono">₹165 / sq.ft</div>
        </div>
      </button>

      <button onclick="setTile('wood', 120, 'Terracotta Teak Wood')" class="tile-btn group relative p-3 rounded-xl border border-slate-800 hover:border-slate-600 bg-slate-900/60 hover:bg-slate-800 transition text-left flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-800 to-amber-950 border border-white/10 shadow-inner flex-shrink-0"></div>
        <div class="overflow-hidden">
          <div class="text-xs font-semibold text-white truncate">Teak Plank</div>
          <div class="text-[11px] text-emerald-400 font-mono">₹120 / sq.ft</div>
        </div>
      </button>

      <button onclick="setTile('concrete', 95, 'Industrial Grey Slate')" class="tile-btn group relative p-3 rounded-xl border border-slate-800 hover:border-slate-600 bg-slate-900/60 hover:bg-slate-800 transition text-left flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-slate-400 to-slate-600 border border-white/10 shadow-inner flex-shrink-0"></div>
        <div class="overflow-hidden">
          <div class="text-xs font-semibold text-white truncate">Grey Slate</div>
          <div class="text-[11px] text-emerald-400 font-mono">₹95 / sq.ft</div>
        </div>
      </button>
    </div>

    <!-- Room Dimension & Calculator -->
    <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800/80 space-y-2.5">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-400">Room Size (Feet):</span>
        <div class="flex items-center gap-1 font-mono">
          <input type="number" id="roomLength" value="16" min="6" max="50" onchange="calculateCost()" class="w-12 bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 text-center text-white text-xs">
          <span class="text-slate-500">×</span>
          <input type="number" id="roomWidth" value="14" min="6" max="50" onchange="calculateCost()" class="w-12 bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 text-center text-white text-xs">
          <span class="text-slate-400">ft</span>
        </div>
      </div>

      <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-800">
        <span class="text-slate-400">Total Coverage:</span>
        <span id="totalSqft" class="font-mono text-white font-semibold">224 sq.ft</span>
      </div>

      <div class="flex justify-between items-center text-sm pt-1 border-t border-slate-800">
        <span class="text-slate-300 font-medium">Estimated Material:</span>
        <span id="totalCost" class="font-mono text-emerald-400 font-bold text-base">₹32,480</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-2">
      <button onclick="triggerAR()" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        View in AR (Phone)
      </button>
      <button onclick="shareWhatsAppQuote()" class="bg-slate-800 hover:bg-slate-700 text-white font-semibold p-2.5 rounded-xl border border-slate-700 transition" title="Send Quote to WhatsApp">
        <svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.97.53 1.961.815 3.031.815 3.177 0 5.764-2.586 5.765-5.766 0-3.18-2.587-5.766-5.765-5.766zm0 10.373c-.927 0-1.782-.261-2.522-.727l-.181-.113-1.874.492.5-1.828-.119-.189c-.516-.819-.829-1.77-.829-2.775 0-2.825 2.299-5.124 5.125-5.124 2.826 0 5.125 2.299 5.125 5.124 0 2.825-2.299 5.124-5.125 5.124z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Three.js Visualizer Engine -->
  <script>
    let scene, camera, renderer, controls, floorMesh, wallMeshBack, wallMeshLeft;
    let currentRate = 145;
    let currentTileName = 'Calacatta Gold Marble';

    // Procedural tile texture generators
    function createMarbleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f8f8f6';
      ctx.fillRect(0, 0, 1024, 1024);
      // Marble veins
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(100, 0);
      ctx.bezierCurveTo(300, 400, 600, 500, 900, 1024);
      ctx.stroke();
      ctx.strokeStyle = '#c5c2b8';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, 300);
      ctx.bezierCurveTo(400, 600, 700, 400, 1024, 800);
      ctx.stroke();
      // Grid grout lines
      ctx.strokeStyle = '#e0ded7';
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, 1024, 1024);
      return new THREE.CanvasTexture(canvas);
    }

    function createNeroTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#141416';
      ctx.fillRect(0, 0, 1024, 1024);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(200, 0);
      ctx.bezierCurveTo(400, 300, 600, 700, 800, 1024);
      ctx.stroke();
      ctx.strokeStyle = '#252528';
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, 1024, 1024);
      return new THREE.CanvasTexture(canvas);
    }

    function createWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#5c3a21';
      ctx.fillRect(0, 0, 1024, 1024);
      ctx.fillStyle = '#4a2e19';
      for(let i=0; i<1024; i+=128) {
        ctx.fillRect(0, i, 1024, 60);
      }
      ctx.strokeStyle = '#2b190c';
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, 1024, 1024);
      return new THREE.CanvasTexture(canvas);
    }

    function createConcreteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#64748b';
      ctx.fillRect(0, 0, 1024, 1024);
      ctx.fillStyle = '#475569';
      for(let i=0; i<1000; i++) {
        ctx.fillRect(Math.random()*1024, Math.random()*1024, 3, 3);
      }
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, 1024, 1024);
      return new THREE.CanvasTexture(canvas);
    }

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color('#0b0e14');

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(7, 5, 8);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 3;
      controls.maxDistance = 18;
      controls.target.set(0, 1.2, 0);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xfff7ed, 1.4);
      mainLight.position.set(6, 9, 6);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      scene.add(mainLight);

      const fillLight = new THREE.PointLight(0xa5f3fc, 0.5, 15);
      fillLight.position.set(-5, 4, -3);
      scene.add(fillLight);

      // Floor Geometry
      const floorGeo = new THREE.PlaneGeometry(8, 8);
      const marbleTex = createMarbleTexture();
      marbleTex.wrapS = THREE.RepeatWrapping;
      marbleTex.wrapT = THREE.RepeatWrapping;
      marbleTex.repeat.set(4, 4);

      const floorMat = new THREE.MeshStandardMaterial({ 
        map: marbleTex, 
        roughness: 0.15, 
        metalness: 0.1 
      });
      floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      // Walls
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e2430, roughness: 0.8 });
      const wallGeo = new THREE.PlaneGeometry(8, 4);

      wallMeshBack = new THREE.Mesh(wallGeo, wallMat);
      wallMeshBack.position.set(0, 2, -4);
      wallMeshBack.receiveShadow = true;
      scene.add(wallMeshBack);

      wallMeshLeft = new THREE.Mesh(wallGeo, wallMat);
      wallMeshLeft.position.set(-4, 2, 0);
      wallMeshLeft.rotation.y = Math.PI / 2;
      wallMeshLeft.receiveShadow = true;
      scene.add(wallMeshLeft);

      // Decorative Modern Furniture / Accent
      const sofaGeo = new THREE.BoxGeometry(3, 0.6, 1.2);
      const sofaMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });
      const sofa = new THREE.Mesh(sofaGeo, sofaMat);
      sofa.position.set(0, 0.3, -2.5);
      sofa.castShadow = true;
      sofa.receiveShadow = true;
      scene.add(sofa);

      const backGeo = new THREE.BoxGeometry(3, 1, 0.3);
      const sofaBack = new THREE.Mesh(backGeo, sofaMat);
      sofaBack.position.set(0, 0.8, -3.0);
      sofaBack.castShadow = true;
      scene.add(sofaBack);

      // Floating modern lamp
      const lampGeo = new THREE.CylinderGeometry(0.04, 0.04, 3);
      const lampMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 });
      const lamp = new THREE.Mesh(lampGeo, lampMat);
      lamp.position.set(-2.5, 1.5, -2.5);
      lamp.castShadow = true;
      scene.add(lamp);

      window.addEventListener('resize', onWindowResize);
      calculateCost();
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function setTile(type, rate, name) {
      currentRate = rate;
      currentTileName = name;
      let newTex;
      if (type === 'marble') newTex = createMarbleTexture();
      else if (type === 'nero') newTex = createNeroTexture();
      else if (type === 'wood') newTex = createWoodTexture();
      else newTex = createConcreteTexture();

      newTex.wrapS = THREE.RepeatWrapping;
      newTex.wrapT = THREE.RepeatWrapping;
      newTex.repeat.set(4, 4);

      floorMesh.material.map = newTex;
      floorMesh.material.needsUpdate = true;
      calculateCost();

      // Update button active state
      document.querySelectorAll('.tile-btn').forEach(btn => {
        btn.classList.remove('border-emerald-500/80');
        btn.classList.add('border-slate-800');
      });
      event.currentTarget.classList.remove('border-slate-800');
      event.currentTarget.classList.add('border-emerald-500/80');
    }

    function calculateCost() {
      const l = parseFloat(document.getElementById('roomLength').value) || 16;
      const w = parseFloat(document.getElementById('roomWidth').value) || 14;
      const sqft = l * w;
      const cost = sqft * currentRate;
      document.getElementById('totalSqft').innerText = sqft + ' sq.ft';
      document.getElementById('totalCost').innerText = '₹' + cost.toLocaleString('en-IN');
    }

    function triggerAR() {
      alert("WebAR Launch: Point your phone camera at your floor to place this " + currentTileName + " floor live!");
    }

    function shareWhatsAppQuote() {
      const sqft = document.getElementById('totalSqft').innerText;
      const cost = document.getElementById('totalCost').innerText;
      const msg = encodeURIComponent("Hi, I previewed the " + currentTileName + " in the 3D room visualizer (" + sqft + ", " + cost + "). I would like to get a quote and check showroom stock.");
      window.open("https://wa.me/919445305525?text=" + msg, "_blank");
    }

    window.onload = init;
  </script>
</body>
</html>
